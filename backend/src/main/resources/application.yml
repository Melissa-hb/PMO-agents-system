server:
  port: ${SERVER_PORT:8080}
  tomcat:
    connection-timeout: 180s

spring:
  application:
    name: pmo-backend

  datasource:
    # Se conecta directamente al Postgres de Supabase (self-hosted). Supabase deja de exponer
    # logica de negocio: solo se usa como base de datos, como proveedor de identidad (GoTrue)
    # y como almacenamiento de archivos (Storage).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      schema: public

  jpa:
    open-in-view: false
    hibernate:
      # 'validate' evita que Hibernate intente crear/alterar el esquema ya existente en Supabase.
      # Cambia a 'none' si prefieres arrancar sin validar contra la base real mientras iteras.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        default_schema: public
        format_sql: false
    show-sql: false

  flyway:
    # El esquema actual vive en Supabase y no esta completamente versionado en este repo.
    # Se deja deshabilitado por defecto; activalo cuando existan migraciones para el backend.
    enabled: ${SPRING_FLYWAY_ENABLED:false}

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

supabase:
  # URL base del proyecto self-hosted (Kong/API gateway), ej: https://api.tuempresa.com
  # Tambien se usa para construir la URL del JWKS de GoTrue (${SUPABASE_URL}/auth/v1/.well-known/jwks.json).
  url: ${SUPABASE_URL:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  anon-key: ${SUPABASE_ANON_KEY:}
  storage:
    bucket: ${SUPABASE_STORAGE_BUCKET:documentos-pmo}
    signed-url-ttl-seconds: ${SUPABASE_STORAGE_SIGNED_URL_TTL:3600}

ai:
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    # Recomendados por OpenRouter para atribucion en su ranking de apps (opcionales).
    site-url: ${OPENROUTER_SITE_URL:}
    app-name: ${OPENROUTER_APP_NAME:PMO Intelligence Platform}

logging:
  level:
    com.pmo.backend: INFO
